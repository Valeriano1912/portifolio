<!DOCTYPE html>
<html lang="pt-MZ" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | João Valeriano Júnior</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .erro { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; gap: 1rem; }
        .erro h1 { font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; color: var(--accent); line-height: 1; }
        .erro p { color: var(--text-secondary); max-width: 420px; }
    </style>
</head>
<body>
    <main class="erro">
        <h1>404</h1>
        <h2>Página não encontrada</h2>
        <p>O endereço que tentou abrir não existe ou foi movido.</p>
        <a href="/" class="btn btn-primary">Voltar ao início</a>
    </main>
</body>
</html>
